    <body ondragstart="return false;" ondrop="return false;" >
        <div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
        <script>
            $(document).ready(function () {
                const GAME_ID = "horse-racing";
                const STARTING_CREDIT = window.VirtualGameStore.getCredit(GAME_ID);
                const BET_LIMITS = window.VirtualGameStore.getBetLimits(GAME_ID, {min: 0.1, max: 100});
                const GAME_CASH = Math.max(STARTING_CREDIT, BET_LIMITS.max);
                const CHIP_FACTORS = BET_LIMITS.min < 1 ? [1, 2, 5, 10, 20, 50, 100] : [1, 5, 10, 25, 50, 100];
                const CHIP_VALUES = Array.from(new Set([BET_LIMITS.min].concat(CHIP_FACTORS.map(function (value) {
                    return Math.round(value * BET_LIMITS.min * 100) / 100;
                })).concat([BET_LIMITS.max]).filter(function (value) {
                    return value >= BET_LIMITS.min && value <= BET_LIMITS.max;
                }))).sort(function (left, right) {
                    return left - right;
                });
                var oMain = new CMain({
                    money:STARTING_CREDIT,           //USER MONEY
                    min_bet:BET_LIMITS.min,           //MINIMUM BET
                    max_bet:BET_LIMITS.max,       //MAXIMUM BET
                    win_occurrence:20,   //WIN OCCURRENCE
                    game_cash:GAME_CASH,       //GAME CASH. STARTING MONEY THAT THE GAME CAN DELIVER.
                    chip_values:CHIP_VALUES, //VALUE OF CHIPS
                    show_credits:true, //SET THIS VALUE TO FALSE IF YOU DON'T TO SHOW CREDITS BUTTON
                    fullscreen:true, //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
                    check_orientation:true,     //SET TO FALSE IF YOU DON'T WANT TO SHOW ORIENTATION ALERT ON MOBILE DEVICES
                    num_levels_for_ads: 2 //NUMBER OF TURNS PLAYED BEFORE AD SHOWING //
                            //////// THIS FEATURE  IS ACTIVATED ONLY WITH CTL ARCADE PLUGIN./////////////////////////// 
                            /////////////////// YOU CAN GET IT AT: ///////////////////////////////////////////////////////// 
                            // http://codecanyon.net/item/ctl-arcade-wordpress-plugin/13856421///////////

                });

                $(oMain).on("start_session", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeStartSession();
                    }
                });

                $(oMain).on("end_session", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeEndSession();
                    }
                });
                
                $(oMain).on("bet_placed", function (evt, iTotBet) {
                            //...ADD YOUR CODE HERE EVENTUALLY
							//alert(iTotBet);
							//alert('bet placed');
							window.VirtualGameStore.setStake(GAME_ID, iTotBet);
                });
                                
                $(oMain).on("save_score", function(evt, iMoney) {
                            window.VirtualGameStore.setCredit(GAME_ID, iMoney);
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeSaveScore({score:iMoney});
                            }
							 //alert(iMoney);
                            //...ADD YOUR CODE HERE EVENTUALLY
                     });

                $(oMain).on("show_interlevel_ad", function (evt) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShowInterlevelAD();
                    }
                });

                $(oMain).on("share_event", function (evt, iScore) {
                    if (getParamValue('ctl-arcade') === "true") {
                        parent.__ctlArcadeShareEvent({img: TEXT_SHARE_IMAGE,
                            title: TEXT_SHARE_TITLE,
                            msg: TEXT_SHARE_MSG1 + iScore
                                    + TEXT_SHARE_MSG2,
                            msg_share: TEXT_SHARE_SHARE1
                                    + iScore + TEXT_SHARE_SHARE1});
                    }
                });

                if (isIOS()) {
                    setTimeout(function () {
                        sizeHandler();
                    }, 200);
                } else {
                    sizeHandler();
                }
            });

        </script>
        <canvas id="canvas" class='ani_hack' width="1216" height="832"> </canvas>
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>
